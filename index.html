<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Space — 3D Cloud Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #03030c;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            position: relative;
        }
        .bg-glow {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.2) 0%, rgba(138, 43, 226, 0.1) 50%, rgba(0,0,0,0) 70%);
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            filter: blur(100px);
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
            z-index: 2;
        }
        h1 {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #8a2be2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }
        .stats-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 1rem 2rem;
            border-radius: 20px;
            display: inline-flex;
            gap: 2rem;
            margin-top: 1rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .stat-item span {
            display: block;
            font-size: 0.85rem;
            color: #a0aec0;
        }
        .stat-item strong {
            font-size: 1.2rem;
            color: #00f2fe;
        }
        
        /* Upload Panel */
        .upload-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(0, 242, 254, 0.3);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin-bottom: 2.5rem;
            cursor: pointer;
            transition: 0.3s;
            z-index: 2;
        }
        .upload-panel:hover {
            border-color: #00f2fe;
            background: rgba(0, 242, 254, 0.04);
        }
        .upload-btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #03030c;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 1rem;
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3);
            transition: 0.3s;
        }
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(0, 242, 254, 0.5);
        }

        /* 3D Fayllar Gridi */
        .files-container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
            z-index: 2;
        }
        .file-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transform: perspective(1000px) rotateX(0deg) rotateY(0deg);
            transition: transform 0.2s ease, box-shadow 0.3s ease, border-color 0.3s;
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .file-card:hover {
            border-color: rgba(0, 242, 254, 0.5);
            box-shadow: 0 25px 50px rgba(0, 242, 254, 0.2);
        }
        .file-icon {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
        }
        .file-name {
            font-size: 1.05rem;
            font-weight: bold;
            margin-bottom: 0.4rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-size {
            font-size: 0.85rem;
            color: #a0aec0;
        }

        /* Modal oyna (Fayl tafsilotlari uchun) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 12, 0.85);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: rgba(20, 20, 40, 0.9);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 24px;
            padding: 2.5rem;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            text-align: center;
            position: relative;
            animation: modalPop 0.3s ease;
        }
        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-title {
            font-size: 1.4rem;
            color: #00f2fe;
            margin-bottom: 1rem;
            word-break: break-all;
        }
        .modal-body {
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            padding: 1rem;
            border-radius: 12px;
            text-align: left;
        }
        .close-btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #03030c;
            border: none;
            padding: 0.6rem 1.8rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
        }
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <header>
        <h1>PHANTOM SPACE</h1>
        <p style="color: #a0aec0;">100,000,000 TB Cheksiz Bulutli 3D Disk</p>
        
        <div class="stats-box">
            <div class="stat-item">
                <span>Jami Xotira</span>
                <strong>100,000,000 TB</strong>
            </div>
            <div class="stat-item">
                <span>Ishlatilgan Hajm</span>
                <strong id="usedStorage">0 MB</strong>
            </div>
            <div class="stat-item">
                <span>Yuklangan Fayllar</span>
                <strong id="fileCount">0 ta</strong>
            </div>
        </div>
    </header>

    <div class="upload-panel" onclick="document.getElementById('fileInput').click()">
        <div style="font-size: 2rem; margin-bottom: 0.5rem;">☁️</div>
        <p>Fayllarni bu yerga tashlang yoki tanlash uchun bosing</p>
        <button class="upload-btn">Fayl Qo'shish</button>
        <input type="file" id="fileInput" multiple onchange="handleFiles(this.files)">
    </div>

    <div class="files-container" id="filesGrid"></div>

    <!-- Ma'lumot ko'rsatish oynasi (Modal) -->
    <div class="modal" id="fileModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title" id="modalFileName">Fayl Nomi</div>
            <div class="modal-body" id="modalFileContent">Ma'lumotlar yuklanmoqda...</div>
            <button class="close-btn" onclick="closeModalBtn()">Yopish</button>
        </div>
    </div>

    <script>
        let totalBytes = 0;
        let fileCounter = 0;

        function formatBytes(bytes) {
            if (bytes === 0) return '0 MB';
            let mb = bytes / (1024 * 1024);
            if (mb < 1024) {
                return mb.toFixed(2) + ' MB';
            } else {
                return (mb / 1024).toFixed(2) + ' GB';
            }
        }

        function handleFiles(files) {
            const grid = document.getElementById('filesGrid');

            for (let i = 0; i < files.length; i++) {
                let file = files[i];
                totalBytes += file.size;
                fileCounter++;

                let card = document.createElement('div');
                card.className = 'file-card';
                card.innerHTML = `
                    <div class="file-icon">📁</div>
                    <div class="file-name" title="${file.name}">${file.name}</div>
                    <div class="file-size">${formatBytes(file.size)}</div>
                `;

                // Fayl ustiga bosilganda uning ma'lumotlarini ochish
                card.addEventListener('click', () => {
                    openFileDetails(file);
                });

                // 3D Tilt effekti
                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;
                    card.style.transform = `perspective(1000px) rotateX(${-y / 5}deg) rotateY(${x / 5}deg) scale(1.03)`;
                });

                card.addEventListener('mouseleave', () => {
                    card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
                });

                grid.appendChild(card);
            }

            document.getElementById('usedStorage').innerText = formatBytes(totalBytes);
            document.getElementById('fileCount').innerText = fileCounter + ' ta';
        }

        function openFileDetails(file) {
            document.getElementById('modalFileName').innerText = file.name;
            const contentBox = document.getElementById('modalFileContent');
            
            let infoHTML = `
                <b>Hajmi:</b> ${formatBytes(file.size)}<br>
                <b>Turi:</b> ${file.type || 'Nomaʼlum / Aniqlanmagan'}<br>
                <b>Oxirgi o'zgartirilgan:</b> ${new Date(file.lastModified).toLocaleDateString()}
            `;

            // Agar matnli fayl bo'lsa, ichidagi matnni ham o'qib ko'rsatish
            if (file.type.includes('text') || file.name.endsWith('.txt') || file.name.endsWith('.md')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    contentBox.innerHTML = infoHTML + `<hr style="margin:10px 0; border-color:rgba(255,255,255,0.1)"><b>Matn mazmuni:</b><br><pre style="white-space: pre-wrap; margin-top:5px;">${e.target.result}</pre>`;
                };
                reader.readAsText(file);
            } else {
                contentBox.innerHTML = infoHTML + `<hr style="margin:10px 0; border-color:rgba(255,255,255,0.1)"><p style="color:#00f2fe;">Bu fayl turi uchun to'g'ridan-to'g'ri ko'rish imkoniyati mavjud emas, lekin u bulutda xavfsiz saqlanmoqda.</p>`;
            }

            document.getElementById('fileModal').style.display = 'flex';
        }

        function closeModal(e) {
            if (e.target.id === 'fileModal') {
                document.getElementById('fileModal').style.display = 'none';
            }
        }

        function closeModalBtn() {
            document.getElementById('fileModal').style.display = 'none';
        }
    </script>
</body>
</html>
