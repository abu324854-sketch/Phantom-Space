<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Space — Ultra Fast Cyber Cloud</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #8a2be2;
            --bg: #010105;
            --card-bg: rgba(255, 255, 255, 0.015);
            --border: rgba(0, 242, 254, 0.2);
            --glow: 0 0 30px rgba(0, 242, 254, 0.35);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem; position: relative; overflow-x: hidden; }
        
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }

        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 1, 5, 0.88); backdrop-filter: blur(30px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .auth-box {
            background: rgba(10, 10, 25, 0.75); border: 1px solid var(--primary);
            padding: 3.5rem 2.5rem; border-radius: 35px; text-align: center; width: 90%; max-width: 440px;
            box-shadow: 0 0 80px rgba(0, 242, 254, 0.2), inset 0 0 30px rgba(0, 242, 254, 0.05);
            animation: floatBox 5s ease-in-out infinite;
        }
        @keyframes floatBox {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(0.5deg); }
        }
        .auth-box h2 { 
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem; letter-spacing: 4px; font-size: 2.2rem; font-weight: 800; 
        }
        .auth-box p { color: #8a99ad; font-size: 0.95rem; margin-bottom: 2.2rem; }
        .auth-box input {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            padding: 1.1rem 1.4rem; border-radius: 18px; color: #fff; font-size: 1.1rem;
            outline: none; margin-bottom: 1.2rem; text-align: center; transition: 0.4s;
        }
        .auth-box input:focus { border-color: var(--primary); box-shadow: var(--glow); background: rgba(0,242,254,0.03); }
        .auth-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: #010105; border: none; padding: 1.1rem; font-weight: 800;
            border-radius: 18px; cursor: pointer; width: 100%; font-size: 1.1rem;
            box-shadow: 0 10px 30px rgba(0,242,254,0.4); transition: 0.3s;
        }
        .auth-btn:hover { transform: scale(1.03); box-shadow: 0 15px 40px rgba(0,242,254,0.6); }

        .main-app { display: none; width: 100%; max-width: 1250px; flex-direction: column; align-items: center; z-index: 2; }
        header { text-align: center; margin-bottom: 3rem; width: 100%; position: relative; }
        
        /* Chiqish tugmasi */
        .logout-btn {
            position: absolute; right: 0; top: 0; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444; padding: 0.5rem 1rem; border-radius: 12px; cursor: pointer; font-weight: 700; transition: 0.3s;
        }
        .logout-btn:hover { background: rgba(239, 68, 68, 0.3); }

        h1 { font-size: 3.5rem; background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 5px; margin-bottom: 0.5rem; font-weight: 900; }
        
        .controls-bar {
            display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 1.5rem; margin-bottom: 2.5rem; flex-wrap: wrap;
        }
        .search-box {
            flex: 1; min-width: 300px; background: var(--card-bg); border: 1px solid var(--border);
            backdrop-filter: blur(25px); border-radius: 22px; padding: 0.9rem 1.5rem; display: flex; align-items: center; gap: 14px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); transition: 0.3s;
        }
        .search-box:focus-within { border-color: var(--primary); box-shadow: var(--glow); }
        .search-box input { background: none; border: none; color: #fff; outline: none; width: 100%; font-size: 1.05rem; }

        .stats-badge {
            background: var(--card-bg); border: 1px solid var(--border); backdrop-filter: blur(25px);
            padding: 0.9rem 2rem; border-radius: 22px; font-size: 1rem; color: #8a99ad;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        .stats-badge strong { color: var(--primary); font-size: 1.1rem; }

        .upload-panel {
            background: var(--card-bg); border: 2px dashed rgba(0, 242, 254, 0.4); backdrop-filter: blur(30px);
            border-radius: 35px; padding: 3.5rem; width: 100%; text-align: center;
            margin-bottom: 3rem; cursor: pointer; transition: 0.4s;
            box-shadow: 0 20px 45px rgba(0,0,0,0.7); position: relative; overflow: hidden;
        }
        .upload-panel:hover, .upload-panel.dragover { background: rgba(0, 242, 254, 0.03); border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 25px 60px rgba(0,242,254,0.2); }
        .upload-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: #010105; border: none; padding: 1rem 2.8rem; font-size: 1.15rem; font-weight: 800;
            border-radius: 25px; cursor: pointer; margin-top: 1.2rem; box-shadow: 0 10px 30px rgba(0, 242, 254, 0.35);
            transition: 0.3s;
        }
        .upload-btn:hover { transform: scale(1.05); box-shadow: 0 15px 40px rgba(0, 242, 254, 0.5); }

        .files-container {
            width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem;
        }
        .file-card {
            background: var(--card-bg); border: 1px solid var(--border); backdrop-filter: blur(25px);
            border-radius: 28px; padding: 2rem; cursor: pointer; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.5); overflow: hidden;
        }
        .file-card:hover { 
            border-color: var(--primary); 
            transform: translateY(-8px) scale(1.02); 
            box-shadow: 0 20px 45px rgba(0,242,254,0.25);
        }
        .file-icon { font-size: 3rem; margin-bottom: 1.2rem; filter: drop-shadow(0 0 10px rgba(0,242,254,0.3)); }
        .file-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .file-size { font-size: 0.9rem; color: #8a99ad; font-weight: 500; }

        /* Modal oyna */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 1, 5, 0.85); backdrop-filter: blur(25px);
            justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background: rgba(8, 8, 22, 0.9); border: 1px solid var(--primary);
            border-radius: 35px; padding: 2.8rem; width: 92%; max-width: 620px; text-align: center;
            box-shadow: 0 0 90px rgba(0, 242, 254, 0.3);
            position: relative;
        }
        .modal-close-icon {
            position: absolute; top: 22px; right: 24px; background: rgba(255,255,255,0.03);
            border: 1px solid var(--border); color: #fff; width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; font-size: 1.2rem;
        }
        .modal-close-icon:hover { background: rgba(0,242,254,0.2); border-color: var(--primary); transform: rotate(90deg); }

        .modal-title { font-size: 1.5rem; background: linear-gradient(135deg, var(--primary), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 1.5rem; word-break: break-all; font-weight: 800; }
        
        .modal-body { 
            color: #cbd5e1; font-size: 1rem; margin-bottom: 2.2rem; text-align: left; 
            background: rgba(0, 0, 0, 0.5); padding: 1.5rem 1.8rem; border-radius: 24px; 
            border: 1px solid rgba(255,255,255,0.04); display: flex; flex-direction: column; gap: 12px;
        }
        
        .modal-preview-container {
            width: 100%; max-height: 320px; border-radius: 18px; overflow: hidden; 
            margin-top: 12px; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.8);
            border: 1px solid var(--border);
        }
        .modal-preview-container img, .modal-preview-container video {
            max-width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px;
        }

        .modal-actions { display: flex; gap: 18px; justify-content: center; }
        .action-btn { 
            padding: 0.9rem 2.2rem; font-weight: 800; border-radius: 22px; cursor: pointer; 
            border: none; font-size: 1.05rem; transition: 0.3s; display: flex; align-items: center; gap: 10px;
        }
        .download-action { 
            background: linear-gradient(135deg, var(--primary), var(--secondary)); 
            color: #010105; box-shadow: 0 8px 25px rgba(0,242,254,0.4); 
        }
        .download-action:hover { transform: scale(1.06); }
        .delete-action { 
            background: rgba(239, 68, 68, 0.12); color: #ef4444; 
            border: 1px solid rgba(239, 68, 68, 0.3); 
        }
        .delete-action:hover { background: rgba(239, 68, 68, 0.25); transform: scale(1.06); }

        /* Qurilma va Tizim Tanlash Oynasi */
        #deviceModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 1, 5, 0.9); backdrop-filter: blur(25px);
            justify-content: center; align-items: center; z-index: 200;
        }
        .device-box {
            background: rgba(10, 10, 25, 0.95); border: 1px solid var(--primary);
            padding: 3rem 2.5rem; border-radius: 35px; text-align: center; width: 90%; max-width: 480px;
            box-shadow: 0 0 80px rgba(0, 242, 254, 0.3);
        }
        .device-box h3 { color: var(--primary); font-size: 1.6rem; margin-bottom: 0.5rem; font-weight: 800; }
        .device-box p { color: #8a99ad; font-size: 0.95rem; margin-bottom: 2rem; }
        .device-options { display: flex; gap: 15px; justify-content: center; margin-bottom: 1.5rem; }
        .device-opt-btn {
            flex: 1; padding: 1.2rem; background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 20px; color: #fff; font-weight: 700; cursor: pointer; transition: 0.3s; font-size: 1rem;
        }
        .device-opt-btn:hover, .device-opt-btn.active { border-color: var(--primary); background: rgba(0,242,254,0.1); box-shadow: var(--glow); }
        
        .sys-select {
            width: 100%; background: rgba(0,0,0,0.6); border: 1px solid var(--border);
            padding: 1rem 1.2rem; border-radius: 16px; color: #fff; font-size: 1.05rem;
            outline: none; margin-bottom: 1.5rem; cursor: pointer; display: none;
        }
        .sys-select option { background: #080816; color: #fff; }

        #toast {
            visibility: hidden; min-width: 280px; background-color: rgba(10, 10, 25, 0.95); color: #fff; border: 1px solid var(--primary);
            text-align: center; border-radius: 18px; padding: 1.2rem; position: fixed; z-index: 3000; right: 35px; bottom: 35px; font-size: 1.05rem;
            box-shadow: 0 20px 50px rgba(0,242,254,0.3); backdrop-filter: blur(20px);
        }
        #toast.show { visibility: visible; animation: fadein 0.4s, fadeout 0.4s 2.6s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 35px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 35px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        #loadingOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1,1,5,0.92); z-index: 2000; justify-content: center; align-items: center;
            color: var(--primary); font-size: 1.25rem; font-weight: 700; flex-direction: column; gap: 24px;
            backdrop-filter: blur(20px);
        }
        .spinner {
            width: 60px; height: 60px; border: 3px solid rgba(0,242,254,0.1); border-top: 3px solid var(--primary);
            border-radius: 50%; animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite; box-shadow: 0 0 25px rgba(0,242,254,0.6);
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div id="webgl-container"></div>
    <div id="loadingOverlay"><div class="spinner"></div><span id="loadingText">Yuklanmoqda...</span></div>
    <div id="toast">Xabar</div>

    <div id="authOverlay">
        <div class="auth-box">
            <h2>PHANTOM SPACE</h2>
            <p>Ultra-Tez Bulut Portali</p>
            <input type="password" id="secretPass" placeholder="Maxfiy parolni kiriting..." onkeypress="if(event.key==='Enter') login()">
            <button class="auth-btn" onclick="login()">Tizimga ulanish</button>
        </div>
    </div>

    <div class="main-app" id="mainApp">
        <header>
            <button class="logout-btn" onclick="logout()">Chiqish 🚪</button>
            <h1>PHANTOM SPACE</h1>
            <p style="color: #8a99ad; font-size: 1.1rem;">Tezkor Shifrlangan Bulutli Ombor</p>
        </header>

        <div class="controls-bar">
            <div class="search-box">
                <span style="font-size: 1.2rem;">🔍</span>
                <input type="text" id="searchInput" placeholder="Fayllar orasidan qidirish..." oninput="renderFiles()">
            </div>
            <div class="stats-badge">
                Ombordagi fayllar: <strong id="fileCount">0 ta</strong>
            </div>
        </div>

        <div class="upload-panel" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <div style="font-size: 3.5rem; margin-bottom: 0.8rem; filter: drop-shadow(0 0 15px rgba(0,242,254,0.4));">☁️</div>
            <p style="font-size: 1.2rem; font-weight: 600;">Fayllarni tanlang yoki shu yerga sudrab tashlang</p>
            <button class="upload-btn">Bulutga Yuklash</button>
            <input type="file" id="fileInput" multiple onchange="uploadFiles(this.files)">
        </div>

        <div class="files-container" id="filesGrid"></div>
    </div>

    <!-- Fayl tafsilotlari Modal -->
    <div class="modal" id="fileModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-close-icon" onclick="closeModalBtn()">✕</div>
            <div class="modal-title" id="modalFileName">fayl.png</div>
            <div class="modal-body" id="modalFileContent"></div>
            <div class="modal-actions">
                <button class="action-btn download-action" id="modalDownloadBtn">📥 Yuklab olish</button>
                <button class="action-btn delete-action" id="modalDeleteBtn">🗑️ O'chirish</button>
            </div>
        </div>
    </div>

    <!-- Qurilma va Tizim Tanlash Oynasi -->
    <div id="deviceModal" style="display: none;">
        <div class="device-box">
            <h3>Qurilmani Tanlang</h3>
            <p>Fayl qaysi turdagi qurilmaga yuklab olinmoqda?</p>
            <div class="device-options">
                <button class="device-opt-btn" id="btnPC" onclick="selectDeviceType('PC')">💻 Kompyuter</button>
                <button class="device-opt-btn" id="btnPhone" onclick="selectDeviceType('Phone')">📱 Telefon</button>
            </div>
            <select class="sys-select" id="sysSelect"></select>
            <button class="auth-btn" id="confirmDownloadBtn" style="display: none;" onclick="executeDownload()">Yuklab Olishni Boshlash</button>
        </div>
    </div>

    <script>
        // --- GITHUB SOZLAMALARI ---
        const GH_USER = "SIZNING_GITHUB_USERNAME";
        const GH_REPO = "SIZNING_REPO_NOMI";
        const GH_TOKEN = "SIZNING_GITHUB_TOKENINGIZ";
        // ---------------------------

        let currentPass = '';
        let filesList = [];
        let selectedFileForDownload = null;
        let selectedDevice = '';
        
        let deviceId = localStorage.getItem('phantom_dev_id') || ('dev_' + Math.random().toString(36).substr(2, 9));
        localStorage.setItem('phantom_dev_id', deviceId);

        // Sahifa ochilganda avval saqlangan parolni tekshirish (Sahifa yangilanganda o'chib ketmasligi uchun)
        window.onload = async function() {
            let savedPass = localStorage.getItem('phantom_saved_pass');
            if(savedPass) {
                document.getElementById('secretPass').value = savedPass;
                await login(true);
            }
        }

        function showToast(text) {
            let t = document.getElementById('toast');
            t.innerText = text;
            t.className = "show";
            setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
        }

        function setLoading(status, text = "Yuklanmoqda...") {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = status ? 'flex' : 'none';
        }

        async function login(isAuto = false) {
            currentPass = document.getElementById('secretPass').value.trim();
            if(!currentPass) return showToast('Parolni kiriting!');

            setLoading(true, 'Tizimga ulanmoqda...');

            try {
                let res = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/passwords_db.json`, {
                    headers: { 'Authorization': `token ${GH_TOKEN}` }
                });

                let db = {};
                let sha = null;
                if(res.ok) {
                    let fileData = await res.json();
                    sha = fileData.sha;
                    db = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
                }

                let passKey = btoa(currentPass);

                if(db[passKey]) {
                    if(db[passKey] !== deviceId) {
                        throw new Error('Bu parol boshqa qurilma tomonidan band qilingan!');
                    }
                } else {
                    db[passKey] = deviceId;
                    await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/passwords_db.json`, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${GH_TOKEN}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: 'Register password', content: btoa(unescape(encodeURIComponent(JSON.stringify(db)))), sha: sha })
                    });
                }

                // Parolni brauzerda eslab qolish (sahifa yangilanganda ham saqlanadi)
                localStorage.setItem('phantom_saved_pass', currentPass);

                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                await loadFiles();
            } catch(e) {
                if(!isAuto) showToast(e.message);
                localStorage.removeItem('phantom_saved_pass');
            } finally {
                setLoading(false);
            }
        }

        function logout() {
            localStorage.removeItem('phantom_saved_pass');
            location.reload();
        }

        async function loadFiles() {
            setLoading(true, 'Fayllar yuklanmoqda...');
            try {
                let folder = `vault_${btoa(currentPass).substr(0,10)}`;
                let indexPath = `${folder}/vault_index.json`;
                
                let res = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${indexPath}`, {
                    headers: { 'Authorization': `token ${GH_TOKEN}` }
                });

                if(res.ok) {
                    let fileData = await res.json();
                    let decodedContent = decodeURIComponent(escape(atob(fileData.content)));
                    filesList = JSON.parse(decodedContent);
                } else {
                    filesList = [];
                }
                renderFiles();
            } catch(e) {
                console.error(e);
                filesList = [];
            } finally {
                setLoading(false);
            }
        }

        async function saveIndexToServer(updatedFiles) {
            let folder = `vault_${btoa(currentPass).substr(0,10)}`;
            let indexPath = `${folder}/vault_index.json`;

            let currentSha = null;
            let checkRes = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${indexPath}`, {
                headers: { 'Authorization': `token ${GH_TOKEN}` }
            });
            if(checkRes.ok) {
                let fileInfo = await checkRes.json();
                currentSha = fileInfo.sha;
            }

            let contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(updatedFiles))));
            let bodyData = {
                message: 'Update vault index safely',
                content: contentEncoded
            };
            if(currentSha) bodyData.sha = currentSha;

            let putRes = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${indexPath}`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${GH_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData)
            });

            if(!putRes.ok) throw new Error('Serverga saqlashda xatolik yuz berdi!');
        }

        async function uploadFiles(newFiles) {
            setLoading(true, 'Bulutga yuklanmoqda...');
            try {
                let promises = Array.from(newFiles).map(f => {
                    return new Promise((resolve) => {
                        let reader = new FileReader();
                        reader.readAsDataURL(f);
                        reader.onload = () => {
                            resolve({
                                id: 'f_' + Date.now() + Math.random().toString(36).substr(2,6),
                                name: f.name,
                                size: f.size,
                                type: f.type,
                                data: reader.result
                            });
                        };
                    });
                });

                let uploadedObjects = await Promise.all(promises);
                
                await loadFiles();
                filesList.push(...uploadedObjects);
                await saveIndexToServer(filesList);

                renderFiles();
                showToast('Fayllar muvaffaqiyatli yuklandi!');
            } catch(e) {
                showToast('Yuklashda xatolik: ' + e.message);
                console.error(e);
            } finally {
                setLoading(false);
            }
        }

        function renderFiles() {
            let grid = document.getElementById('filesGrid');
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = filesList.filter(f => f.name.toLowerCase().includes(query));
            
            document.getElementById('fileCount').innerText = filesList.length + ' ta';
            grid.innerHTML = '';

            filtered.forEach(f => {
                let icon = '📁';
                if(f.type && f.type.includes('image')) icon = '🖼️';
                else if(f.type && f.type.includes('video')) icon = '🎬';
                else if(f.type && f.type.includes('audio')) icon = '🎵';

                let card = document.createElement('div');
                card.className = 'file-card';
                card.innerHTML = `
                    <div class="file-icon">${icon}</div>
                    <div class="file-name">${f.name}</div>
                    <div class="file-size">${(f.size / 1024 / 1024).toFixed(2)} MB</div>
                `;
                card.onclick = () => openModal(f);
                grid.appendChild(card);
            });
        }

        function openModal(f) {
            selectedFileForDownload = f;
            document.getElementById('modalFileName').innerText = f.name;
            
            let bodyHTML = `
                <div>📦 <b>Hajmi:</b> ${(f.size / 1024 / 1024).toFixed(2)} MB</div>
                <div>📄 <b>Turi:</b> ${f.type || 'Nomaʼlum'}</div>
            `;

            if(f.type && f.type.includes('image')) {
                bodyHTML += `<div class="modal-preview-container"><img src="${f.data}"></div>`;
            } else if(f.type && f.type.includes('video')) {
                bodyHTML += `<div class="modal-preview-container"><video controls src="${f.data}"></video></div>`;
            } else if(f.type && f.type.includes('audio')) {
                bodyHTML += `<div style="margin-top: 10px;"><audio controls src="${f.data}" style="width: 100%;"></audio></div>`;
            }

            document.getElementById('modalFileContent').innerHTML = bodyHTML;
            document.getElementById('modalDownloadBtn').onclick = () => {
                closeModalBtn();
                openDeviceModal();
            };
            document.getElementById('modalDeleteBtn').onclick = () => deleteFile(f.id);
            document.getElementById('fileModal').style.display = 'flex';
        }

        function openDeviceModal() {
            selectedDevice = '';
            document.getElementById('btnPC').classList.remove('active');
            document.getElementById('btnPhone').classList.remove('active');
            let sysSelect = document.getElementById('sysSelect');
            sysSelect.style.display = 'none';
            sysSelect.innerHTML = '';
            document.getElementById('confirmDownloadBtn').style.display = 'none';
            document.getElementById('deviceModal').style.display = 'flex';
        }

        function selectDeviceType(type) {
            selectedDevice = type;
            let btnPC = document.getElementById('btnPC');
            let btnPhone = document.getElementById('btnPhone');
            let sysSelect = document.getElementById('sysSelect');
            let confirmBtn = document.getElementById('confirmDownloadBtn');

            sysSelect.style.display = 'block';
            confirmBtn.style.display = 'block';
            sysSelect.innerHTML = '';

            if(type === 'PC') {
                btnPC.classList.add('active');
                btnPhone.classList.remove('active');
                ['Windows (64-bit / 32-bit)', 'macOS (Apple Silicon / Intel)', 'Linux (Ubuntu, Debian, Fedora va b.)'].forEach(sys => {
                    let opt = document.createElement('option');
                    opt.value = sys;
                    opt.innerText = sys;
                    sysSelect.appendChild(opt);
                });
            } else {
                btnPhone.classList.add('active');
                btnPC.classList.remove('active');
                ['Android (Samsung, Redmi, Poco va b.)', 'iOS (iPhone / iPad)', 'HarmonyOS'].forEach(sys => {
                    let opt = document.createElement('option');
                    opt.value = sys;
                    opt.innerText = sys;
                    sysSelect.appendChild(opt);
                });
            }
        }

        function executeDownload() {
            if(!selectedFileForDownload) return;
            let sys = document.getElementById('sysSelect').value;
            document.getElementById('deviceModal').style.display = 'none';

            showToast(`Fayl ${selectedDevice} (${sys}) uchun yuklanmoqda...`);

            let a = document.createElement('a');
            a.href = selectedFileForDownload.data;
            a.download = selectedFileForDownload.name;
            a.click();
        }

        async function deleteFile(id) {
            if(!confirm('Bu faylni o\'chirishni xohlaysizmi?')) return;
            closeModalBtn();
            setLoading(true, 'O\'chirilmoqda...');
            
            try {
                await loadFiles();
                filesList = filesList.filter(f => f.id !== id);
                await saveIndexToServer(filesList);

                renderFiles();
                showToast('Fayl o\'chirildi!');
            } catch(e) {
                showToast('Xatolik yuz berdi!');
            } finally {
                setLoading(false);
            }
        }

        function closeModal(e) { if(e.target.id === 'fileModal') closeModalBtn(); }
        function closeModalBtn() { document.getElementById('fileModal').style.display = 'none'; }

        const dropZone = document.getElementById('dropZone');
        ['dragenter', 'dragover'].forEach(name => dropZone.addEventListener(name, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); }));
        ['dragleave', 'drop'].forEach(name => dropZone.addEventListener(name, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); }));
        dropZone.addEventListener('drop', (e) => {
            if(e.dataTransfer.files.length > 0) uploadFiles(e.dataTransfer.files);
        });

        // Three.js 3D Fon Animatsiyasi
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true }); 
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const torusGeometry = new THREE.TorusGeometry(12, 0.4, 16, 100);
        const torusMaterial = new THREE.MeshBasicMaterial({ color: 0x00f2fe, wireframe: true, transparent: true, opacity: 0.25 });
        const torus = new THREE.Mesh(torusGeometry, torusMaterial);
        scene.add(torus);

        const starsGeo = new THREE.BufferGeometry(); 
        const starPositions = new Float32Array(2000 * 3);
        for(let i = 0; i < 6000; i++) starPositions[i] = (Math.random() - 0.5) * 300;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMat = new THREE.PointsMaterial({ size: 0.8, color: 0x4facfe });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        camera.position.z = 35;

        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.0005;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.0005;
        });

        (function animate3D() { 
            requestAnimationFrame(animate3D); 
            stars.rotation.y += 0.0008;
            torus.rotation.x += 0.003;
            torus.rotation.y += 0.005;
            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);
            renderer.render(scene, camera); 
        })();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
