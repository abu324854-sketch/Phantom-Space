<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Space — Virtual P: Drive (Cloud)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #03030c;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.2) 0%, rgba(79, 70, 229, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            filter: blur(70px);
        }
        .container {
            text-align: center;
            padding: 2rem;
            z-index: 2;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            border-radius: 24px;
            padding: 3.5rem 2.5rem;
            max-width: 680px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #8a2be2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        p {
            color: #a0aec0;
            font-size: 1.15rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        .features {
            display: flex;
            justify-content: space-around;
            margin-bottom: 2.5rem;
            color: #cbd5e1;
            font-size: 0.95rem;
        }
        .feature-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.6rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #03030c;
            border: none;
            padding: 1.1rem 2.8rem;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 35px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(0, 242, 254, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 35px rgba(0, 242, 254, 0.6);
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .status {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #4ade80;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .dot {
            width: 9px;
            height: 9px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 12px #4ade80;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.35); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="container">
        <div class="card">
            <h1>PHANTOM SPACE</h1>
            <p>Windows kompyuteringizda cheksiz hajmli bulutli <b>P: diskingizni</b> yarating. Kompyuter xotirasini Band qilmasdan barcha fayllaringizni onlayn boshqaring.</p>
            
            <div class="features">
                <div class="feature-item">⚡ 0 MB Lokal Xotira</div>
                <div class="feature-item">♾️ Cheksiz Bulut</div>
                <div class="feature-item">🔒 Xavfsiz Shifrlash</div>
            </div>

            <!-- Dasturni yuklab olish uchun haqiqiy havola yoki fayl manzili -->
            <a href="phantom-client.exe" download class="btn">Dasturni Yuklab Olish</a>
            
            <div class="status">
                <span class="dot"></span>
                <span>Bulutli serverga ulanish: Tayyor</span>
            </div>
        </div>
    </div>
</body>
</html>
