<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Space — Virtual P: Drive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #03030c;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .bg-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.15) 0%, rgba(79, 70, 229, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            filter: blur(60px);
        }
        .container {
            text-align: center;
            padding: 2rem;
            z-index: 2;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 3rem 2rem;
            max-width: 650px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: perspective(1000px) rotateX(3deg);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }
        .card:hover {
            transform: perspective(1000px) rotateX(0deg) scale(1.01);
            box-shadow: 0 30px 60px rgba(0, 242, 254, 0.25), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        h1 {
            font-size: 2.8rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #8a2be2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        p {
            color: #a0aec0;
            font-size: 1.1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #03030c;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 242, 254, 0.5);
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        .status {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #4ade80;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 10px #4ade80;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="container">
        <div class="card">
            <h1>PHANTOM SPACE</h1>
            <p>Windows kompyuteringizda xavfsiz va shifrlangan virtual P: diskingizni o'rnating. Fayllaringizni to'g'ridan-to'g'ri bulutga ulang.</p>
            
            <!-- Bu yerga dasturingizning yuklab olish havolasini (.exe fayl linkini) qo'yasiz -->
            <a href="#" class="btn" onclick="alert('Desktop ilova yuklab olish uchun tayyorlanmoqda!')">Dasturni Yuklab Olish</a>
            
            <div class="status">
                <span class="dot"></span>
                <span>Tizim holati: Versiya 1.0 Tayyor</span>
            </div>
        </div>
    </div>
</body>
</html>
