<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Space — Ultimate Quantum Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Orqa fon va umumiy sozlamalar */
        body {
            background-color: #030712;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
            position: relative;
            margin: 0;
            min-height: 100vh;
        }

        /* 1-Effekt: Orqa fondagi zarrachalar kanvasi */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* 2-Effekt: Logotip va elementlar uchun suzish va neon porlash animatsiyasi */
        @keyframes floatGlow {
            0%, 100% {
                transform: translateY(0);
                filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.4));
            }
            50% {
                transform: translateY(-6px);
                filter: drop-shadow(0 0 25px rgba(189, 0, 255, 0.7));
            }
        }

        .phantom-logo-effect {
            animation: floatGlow 4s ease-in-out infinite;
        }

        /* 3-Effekt: Glassmorphism va 3D Tilt kartochkalar */
        .interactive-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.1s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        .interactive-card:hover {
            border-color: rgba(0, 243, 255, 0.4);
            box-shadow: 0 10px 30px -10px rgba(0, 243, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- 1-Effekt uchun orqa fon kanvasi -->
    <canvas id="particle-canvas"></canvas>

    <!-- Asosiy interfeys -->
    <div class="min-h-screen flex flex-col items-center p-4 md:p-6">
        
        <!-- Yuqori menyu -->
        <header class="w-full max-w-6xl flex flex-wrap justify-between items-center py-4 mb-8">
            <div class="flex items-center gap-3 phantom-logo-effect cursor-pointer">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center font-bold text-xl shadow-lg shadow-cyan-500/30">PS</div>
                <h1 class="text-2xl md:text-3xl font-extrabold tracking-wider bg-gradient-to-r from-cyan-400 via-indigo-300 to-purple-500 bg-clip-text text-transparent">
                    PHANTOM SPACE
                </h1>
            </div>
            
            <div class="flex items-center gap-3 mt-4 md:mt-0">
                <button class="px-4 py-2 text-xs md:text-sm font-medium rounded-lg bg-cyan-950/40 text-cyan-300 border border-cyan-800/50 hover:bg-cyan-900/40 transition">✨ 3D Ko'rinish</button>
                <button class="px-4 py-2 text-xs md:text-sm font-medium rounded-lg bg-purple-950/40 text-purple-300 border border-purple-800/50 hover:bg-purple-900/40 transition">⚡ P2P Tarmoq</button>
                <button class="px-4 py-2 text-xs md:text-sm font-medium rounded-lg bg-red-950/40 text-red-300 border border-red-800/50 hover:bg-red-900/40 transition">Chiqish</button>
            </div>
        </header>

        <!-- Qidiruv va statistika paneli -->
        <div class="w-full max-w-6xl flex flex-wrap gap-4 justify-between items-center mb-8">
            <div class="flex-1 min-w-[280px] interactive-card rounded-xl px-4 py-3 flex items-center gap-3">
                <span class="text-cyan-400">🔍</span>
                <input type="text" placeholder="Fayllar orasidan tezkor qidirish..." class="bg-transparent border-none outline-none w-full text-sm text-gray-200 placeholder-gray-500">
            </div>
            
            <div class="interactive-card rounded-xl px-5 py-3 text-sm text-gray-300 flex items-center gap-6">
                <div>Fayllar Soni: <span class="font-bold text-cyan-400">1 ta</span></div>
                <div>Xotira Joyi: <span class="font-bold text-cyan-400">0.0 MB / 50 TB</span></div>
            </div>
        </div>

        <!-- Fayl tashlash (Upload) qismi -->
        <div class="w-full max-w-6xl interactive-card rounded-2xl p-8 md:p-12 text-center mb-8 border-dashed border-cyan-500/30">
            <div class="w-16 h-16 mx-auto mb-4 flex items-center justify-center rounded-full bg-cyan-500/10 text-cyan-400 text-2xl shadow-inner">☁️</div>
            <h2 class="text-lg md:text-xl font-semibold mb-2">Fayllarni tashlang (barcha qurilmalarda sinxronlanadi)</h2>
            <p class="text-xs text-gray-400 mb-6">Barcha qurilmalar uchun yagona bulut (100 TB)</p>
            <button class="px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-500 text-gray-950 font-bold shadow-lg shadow-cyan-500/30 hover:scale-105 transition">
                Chaqmoq Tezligida Yuklash
            </button>
        </div>

        <!-- Fayl kartochkasi namunasi -->
        <div class="w-full max-w-6xl grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <div class="interactive-card rounded-2xl p-5 cursor-pointer">
                <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 text-xl mb-4">📁</div>
                <h3 class="font-medium text-sm text-gray-200 truncate mb-1">Reyting daftarcha (1).pdf</h3>
                <p class="text-xs text-gray-500">0.03 MB</p>
            </div>
        </div>

    </div>

    <!-- JavaScript effektlari -->
    <script>
        // --- 1-VIZUAL EFFEKT: Dinamik Zarrachalar Kanvasi ---
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let particlesArray = [];
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const mouse = { x: null, y: null, radius: 160 };
        window.addEventListener('mousemove', (event) => {
            mouse.x = event.clientX;
            mouse.y = event.clientY;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.8;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 25) + 1;
                this.color = Math.random() > 0.4 ? '#00f3ff' : '#bd00ff';
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }
            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                let maxDistance = mouse.radius;
                let force = (maxDistance - distance) / maxDistance;
                let directionX = forceDirectionX * force * this.density;
                let directionY = forceDirectionY * force * this.density;

                if (distance < mouse.radius) {
                    this.x -= directionX;
                    this.y -= directionY;
                } else {
                    if (this.x !== this.baseX) {
                        let dx = this.x - this.baseX;
                        this.x -= dx / 12;
                    }
                    if (this.y !== this.baseY) {
                        let dy = this.y - this.baseY;
                        this.y -= dy / 12;
                    }
                }
            }
        }

        function initParticles() {
            particlesArray = [];
            let numberOfParticles = (canvas.width * canvas.height) / 10000;
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }
        initParticles();

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(particle => {
                particle.update();
                particle.draw();
            });

            // Zarrachalarni o'zaro chiziqlar bilan bog'lash (tarmoq effekti)
            for (let a = 0; a < particlesArray.length; a++) {
                for (let b = a + 1; b < particlesArray.length; b++) {
                    let distance = ((particlesArray[a].x - particlesArray[b].x) * (particlesArray[a].x - particlesArray[b].x)) +
                                   ((particlesArray[a].y - particlesArray[b].y) * (particlesArray[a].y - particlesArray[b].y));
                    if (distance < 14000) {
                        ctx.strokeStyle = `rgba(0, 243, 255, ${0.12 - distance / 14000})`;
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(particlesArray[a].x, particlesArray[a].y);
                        ctx.lineTo(particlesArray[b].x, particlesArray[b].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // --- 3-VIZUAL EFFEKT: Kartochkalar va Bloklar uchun 3D Tilt ---
        document.querySelectorAll('.interactive-card').forEach(card => {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const xc = rect.width / 2;
                const yc = rect.height / 2;
                const dx = (x - xc) / 20;
                const dy = (yc - y) / 20;
                card.style.transform = `rotateY(${dx}deg) rotateX(${dy}deg) scale(1.01)`;
            });

            card.addEventListener('mouseleave', () => {
                card.style.transform = 'rotateY(0deg) rotateX(0deg) scale(1)';
            });
        });
    </script>
</body>
</html>
