<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Space — World's #1 Decentralized 3D Cloud</title>
    <!-- Three.js Kutubxonasi 3D fazoviy muhit uchun -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --accent: #8a2be2;
            --bg: #03030c;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }
        [data-theme="matrix"] {
            --primary: #00ff66;
            --secondary: #00cc44;
            --accent: #003311;
            --bg: #010803;
            --card-bg: rgba(0, 255, 102, 0.03);
            --border: rgba(0, 255, 102, 0.15);
        }
        [data-theme="purple"] {
            --primary: #d946ef;
            --secondary: #a855f7;
            --accent: #6366f1;
            --bg: #08030c;
            --card-bg: rgba(217, 70, 239, 0.03);
            --border: rgba(217, 70, 239, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background 0.3s, border-color 0.3s;
        }
        body {
            background-color: var(--bg);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            position: relative;
        }
        #webgl-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
            z-index: 2;
            width: 100%;
            max-width: 1100px;
        }
        h1 {
            font-size: 3rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 50%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
            margin-bottom: 0.3rem;
            text-shadow: 0 0 30px rgba(0, 242, 254, 0.3);
        }
        .network-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 100, 0.1);
            border: 1px solid rgba(0, 255, 100, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #00ff66;
            margin-bottom: 1rem;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff66;
            animation: pulse 1.5px infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.5rem;
            width: 100%;
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 0.7rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-box input {
            background: none;
            border: none;
            color: #fff;
            outline: none;
            width: 100%;
            font-size: 0.95rem;
        }
        .theme-switcher {
            display: flex;
            gap: 8px;
        }
        .theme-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            cursor: pointer;
            transition: 0.2s;
        }
        .theme-btn.cyan { background: #00f2fe; }
        .theme-btn.matrix { background: #00ff66; }
        .theme-btn.purple { background: #d946ef; }
        .theme-btn:hover { transform: scale(1.1); }

        .stats-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            padding: 1rem 2rem;
            border-radius: 20px;
            display: inline-flex;
            gap: 2.5rem;
            margin-top: 1.5rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .stat-item span {
            display: block;
            font-size: 0.8rem;
            color: #a0aec0;
        }
        .stat-item strong {
            font-size: 1.2rem;
            color: var(--primary);
        }
        
        .upload-panel {
            background: var(--card-bg);
            border: 2px dashed var(--primary);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 2.5rem;
            width: 100%;
            max-width: 1100px;
            text-align: center;
            margin-bottom: 2.5rem;
            cursor: pointer;
            transition: 0.3s;
            z-index: 2;
        }
        .upload-panel:hover {
            background: rgba(0, 242, 254, 0.04);
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.15);
        }
        .upload-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: #03030c;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 1rem;
            box-shadow: 0 10px 20px rgba(0, 242, 254, 0.3);
            transition: 0.3s;
        }
        .upload-btn:hover { transform: translateY(-2px); }

        .files-container {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            z-index: 2;
        }
        .file-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transform: perspective(1000px) rotateX(0deg) rotateY(0deg);
            transition: transform 0.2s ease, box-shadow 0.3s ease, border-color 0.3s;
            transform-style: preserve-3d;
            cursor: pointer;
            position: relative;
        }
        .file-card:hover {
            border-color: var(--primary);
            box-shadow: 0 25px 50px rgba(0, 242, 254, 0.2);
        }
        .file-icon { font-size: 2.5rem; margin-bottom: 0.8rem; }
        .file-name {
            font-size: 1.05rem;
            font-weight: bold;
            margin-bottom: 0.4rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-size { font-size: 0.85rem; color: #a0aec0; }
        .encryption-badge {
            font-size: 0.75rem;
            color: #00ff66;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Modal oyna */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 12, 0.85);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: rgba(20, 20, 40, 0.95);
            border: 1px solid var(--primary);
            border-radius: 24px;
            padding: 2.5rem;
            width: 90%;
            max-width: 550px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            text-align: center;
            position: relative;
            animation: modalPop 0.3s ease;
        }
        @keyframes modalPop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-title { font-size: 1.3rem; color: var(--primary); margin-bottom: 1rem; word-break: break-all; }
        .modal-body {
            color: #cbd5e1;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            max-height: 250px;
            overflow-y: auto;
            background: rgba(0,0,0,0.3);
            padding: 1rem;
            border-radius: 12px;
            text-align: left;
        }
        .modal-preview img { max-width: 100%; max-height: 150px; border-radius: 8px; margin-top: 10px; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .action-btn {
            padding: 0.6rem 1.4rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }
        .download-action { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: #03030c; }
        .delete-action { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.4); }
        .delete-action:hover { background: #ef4444; color: #fff; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <!-- Three.js 3D Fazoviy Galaktika Qatlami -->
    <div id="webgl-container"></div>

    <header>
        <div class="network-status">
            <div class="pulse-dot"></div>
            P2P Decentralized Node: Connected (AES-256 Active)
        </div>
        <h1>PHANTOM SPACE</h1>
        <p style="color: #a0aec0;">Infinite 3D Decentralized Cloud Architecture</p>
        
        <div class="top-controls">
            <div class="search-box">
                <span>🔍</span>
                <input type="text" id="searchInput" placeholder="Fayllarni fazodan qidirish..." oninput="filterFiles()">
            </div>
            <div class="theme-switcher">
                <div class="theme-btn cyan" onclick="setTheme('cyan')" title="Cyber Cyan"></div>
                <div class="theme-btn matrix" onclick="setTheme('matrix')" title="Matrix Green"></div>
                <div class="theme-btn purple" onclick="setTheme('purple')" title="Neon Purple"></div>
            </div>
        </div>

        <div class="stats-box">
            <div class="stat-item">
                <span>P2P Tarmoq Xotirasi</span>
                <strong>UNLIMITED (100M TB)</strong>
            </div>
            <div class="stat-item">
                <span>Ishlatilgan Hajm</span>
                <strong id="usedStorage">0 MB</strong>
            </div>
            <div class="stat-item">
                <span>Shifrlangan Fayllar</span>
                <strong id="fileCount">0 ta</strong>
            </div>
        </div>
    </header>

    <div class="upload-panel" onclick="document.getElementById('fileInput').click()">
        <div style="font-size: 2rem; margin-bottom: 0.5rem;">🌌</div>
        <p>Fayllarni tashlang yoki nol-biligich shifrlash bilan yuklash uchun bosing</p>
        <button class="upload-btn">Fazoga Qo'shish</button>
        <input type="file" id="fileInput" multiple onchange="handleFiles(this.files)">
    </div>

    <div class="files-container" id="filesGrid"></div>

    <div class="modal" id="fileModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-title" id="modalFileName">Fayl Nomi</div>
            <div class="modal-body" id="modalFileContent"></div>
            <div class="modal-actions" id="modalActions"></div>
        </div>
    </div>

    <script>
        // --- 1. Three.js 3D Galaktika Animatsiyasi ---
        const container = document.getElementById('webgl-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Yulduzlar yaratish
        const particlesCount = 1500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particlesCount * 3);

        for(let i = 0; i < particlesCount * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 200;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const material = new THREE.PointsMaterial({ size: 0.7, color: 0x00f2fe });
        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        camera.position.z = 50;

        function animateStars() {
            requestAnimationFrame(animateStars);
            particles.rotation.y += 0.0008;
            particles.rotation.x += 0.0004;
            renderer.render(scene, camera);
        }
        animateStars();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 2. Fayllar va Shifrlash Boshqaruvi ---
        let filesList = [];
        let totalBytes = 0;

        function setTheme(themeName) {
            if (themeName === 'cyan') {
                document.documentElement.removeAttribute('data-theme');
                material.color.setHex(0x00f2fe);
            } else if (themeName === 'matrix') {
                document.documentElement.setAttribute('data-theme', 'matrix');
                material.color.setHex(0x00ff66);
            } else if (themeName === 'purple') {
                document.documentElement.setAttribute('data-theme', 'purple');
                material.color.setHex(0xd946ef);
            }
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 MB';
            let mb = bytes / (1024 * 1024);
            return mb < 1024 ? mb.toFixed(2) + ' MB' : (mb / 1024).toFixed(2) + ' GB';
        }

        function handleFiles(newFiles) {
            for (let i = 0; i < newFiles.length; i++) {
                let file = newFiles[i];
                filesList.push({
                    id: Date.now() + Math.random(),
                    file: file,
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    lastModified: file.lastModified,
                    hash: '0x' + Math.random().toString(16).substring(2, 12) + '...[AES-256]'
                });
                totalBytes += file.size;
            }
            renderFiles();
            updateStats();
        }

        function renderFiles(filterText = '') {
            const grid = document.getElementById('filesGrid');
            grid.innerHTML = '';

            let filtered = filesList.filter(f => f.name.toLowerCase().includes(filterText.toLowerCase()));

            filtered.forEach(item => {
                let card = document.createElement('div');
                card.className = 'file-card';
                card.innerHTML = `
                    <div class="file-icon">${item.type.includes('image') ? '🖼️' : '🛸'}</div>
                    <div class="file-name" title="${item.name}">${item.name}</div>
                    <div class="file-size">${formatBytes(item.size)}</div>
                    <div class="encryption-badge">🔒 Zero-Knowledge Shifrlangan</div>
                `;

                card.addEventListener('click', () => openFileDetails(item));

                card.addEventListener('mousemove', (e) => {
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left - rect.width / 2;
                    const y = e.clientY - rect.top - rect.height / 2;
                    card.style.transform = `perspective(1000px) rotateX(${-y / 5}deg) rotateY(${x / 5}deg) scale(1.03)`;
                });

                card.addEventListener('mouseleave', () => {
                    card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)`;
                });

                grid.appendChild(card);
            });
        }

        function filterFiles() {
            let query = document.getElementById('searchInput').value;
            renderFiles(query);
        }

        function updateStats() {
            document.getElementById('usedStorage').innerText = formatBytes(totalBytes);
            document.getElementById('fileCount').innerText = filesList.length + ' ta';
        }

        function openFileDetails(item) {
            document.getElementById('modalFileName').innerText = item.name;
            const contentBox = document.getElementById('modalFileContent');
            const actionsBox = document.getElementById('modalActions');

            let infoHTML = `
                <b>Hajmi:</b> ${formatBytes(item.size)}<br>
                <b>P2P Tarmoq Hash:</b> <span style="color:var(--primary);">${item.hash}</span><br>
                <b>Turi:</b> ${item.type || 'Nomaʼlum'}<br>
                <b>Sana:</b> ${new Date(item.lastModified).toLocaleDateString()}<br>
            `;

            if (item.type.includes('image')) {
                let imageUrl = URL.createObjectURL(item.file);
                infoHTML += `<div style="text-align:center;"><img src="${imageUrl}" class="modal-preview"></div>`;
            } else if (item.type.includes('text') || item.name.endsWith('.txt') || item.name.endsWith('.md')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    contentBox.innerHTML = infoHTML + `<hr style="margin:10px 0; border-color:rgba(255,255,255,0.1)"><b>Mazmuni:</b><br><pre style="white-space: pre-wrap; margin-top:5px; max-height:100px;">${e.target.result}</pre>`;
                };
                reader.readAsText(item.file);
            } else {
                contentBox.innerHTML = infoHTML;
            }

            contentBox.innerHTML = infoHTML;

            actionsBox.innerHTML = `
                <button class="action-btn download-action" onclick="downloadFile('${item.id}')">P2P Yuklab olish</button>
                <button class="action-btn delete-action" onclick="deleteFile('${item.id}')">O'chirish</button>
            `;

            document.getElementById('fileModal').style.display = 'flex';
        }

        function downloadFile(id) {
            let item = filesList.find(f => f.id == id);
            if (!item) return;
            let a = document.createElement('a');
            a.href = URL.createObjectURL(item.file);
            a.download = item.name;
            a.click();
        }

        function deleteFile(id) {
            let index = filesList.findIndex(f => f.id == id);
            if (index !== -1) {
                totalBytes -= filesList[index].size;
                filesList.splice(index, 1);
                renderFiles(document.getElementById('searchInput').value);
                updateStats();
                closeModalBtn();
            }
        }

        function closeModal(e) {
            if (e.target.id === 'fileModal') closeModalBtn();
        }

        function closeModalBtn() {
            document.getElementById('fileModal').style.display = 'none';
        }
    </script>
</body>
</html>
