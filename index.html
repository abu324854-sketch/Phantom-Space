<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Space — Secure Cloud</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg: #03030c;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem; position: relative; overflow-x: hidden; }
        #webgl-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; }

        /* Sodda va qulay kirish oynasi */
        #authOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 12, 0.95); backdrop-filter: blur(20px);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .auth-box {
            background: rgba(20, 20, 40, 0.9); border: 1px solid var(--primary);
            padding: 2.5rem; border-radius: 24px; text-align: center; width: 90%; max-width: 380px;
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.2);
        }
        .auth-box h2 { color: var(--primary); margin-bottom: 0.5rem; letter-spacing: 2px; }
        .auth-box p { color: #a0aec0; font-size: 0.85rem; margin-bottom: 1.5rem; }
        .auth-box input {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border);
            padding: 0.9rem 1rem; border-radius: 12px; color: #fff; font-size: 1rem;
            outline: none; margin-bottom: 1rem; text-align: center;
        }
        .auth-box input:focus { border-color: var(--primary); }
        .auth-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: #03030c; border: none; padding: 0.9rem; font-weight: bold;
            border-radius: 15px; cursor: pointer; width: 100%; font-size: 1rem;
            box-shadow: 0 10px 20px rgba(0,242,254,0.3);
        }

        .main-app { display: none; width: 100%; flex-direction: column; align-items: center; }
        header { text-align: center; margin-bottom: 2rem; z-index: 2; width: 100%; max-width: 1100px; }
        h1 { font-size: 2.5rem; color: var(--primary); margin-bottom: 0.3rem; letter-spacing: 2px; }
        
        .upload-panel {
            background: var(--card-bg); border: 2px dashed var(--primary); backdrop-filter: blur(20px);
            border-radius: 24px; padding: 2rem; width: 100%; max-width: 1100px; text-align: center;
            margin-bottom: 2rem; cursor: pointer; transition: 0.3s; z-index: 2;
        }
        .upload-panel:hover { background: rgba(0, 242, 254, 0.04); }
        .upload-btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: #03030c; border: none; padding: 0.8rem 2rem; font-size: 1rem; font-weight: bold;
            border-radius: 30px; cursor: pointer; margin-top: 1rem;
        }

        .files-container {
            width: 100%; max-width: 1100px; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; z-index: 2;
        }
        .file-card {
            background: var(--card-bg); border: 1px solid var(--border); backdrop-filter: blur(15px);
            border-radius: 20px; padding: 1.5rem; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .file-card:hover { border-color: var(--primary); }
        .file-name { font-size: 1rem; font-weight: bold; margin-bottom: 0.4rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-size { font-size: 0.8rem; color: #a0aec0; }
        input[type="file"] { display: none; }

        #loadingOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3,3,12,0.85); z-index: 2000; justify-content: center; align-items: center;
            color: var(--primary); font-size: 1.1rem; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="webgl-container"></div>
    <div id="loadingOverlay">Yuklanmoqda...</div>

    <!-- Juda sodda kirish oynasi (Faqat parol) -->
    <div id="authOverlay">
        <div class="auth-box">
            <h2>PHANTOM SPACE</h2>
            <p>Shaxsiy parolingizni kiriting</p>
            <input type="password" id="secretPass" placeholder="Parol (PIN)">
            <button class="auth-btn" onclick="login()">Kirish</button>
        </div>
    </div>

    <!-- Asosiy Dastur -->
    <div class="main-app" id="mainApp">
        <header>
            <h1>PHANTOM SPACE</h1>
            <p style="color: #a0aec0;">Bulutli Xavfsiz Ombor</p>
        </header>

        <div class="upload-panel" onclick="document.getElementById('fileInput').click()">
            <p>📁 Fayllarni tanlang (Kompyuter xotirasiga saqlanmaydi)</p>
            <button class="upload-btn">Bulutga Yuklash</button>
            <input type="file" id="fileInput" multiple onchange="uploadFiles(this.files)">
        </div>

        <div class="files-container" id="filesGrid"></div>
    </div>

    <script>
        // --- SOZLAMALAR (Bularni o'zingizning GitHub ma'lumotlaringiz bilan to'ldiring) ---
        const GH_USER = "SIZNING_GITHUB_USERNAME"; 
        const GH_REPO = "SIZNING_REPO_NOMI";
        const GH_TOKEN = "SIZning_GITHUB_TOKENINGiz";
        // --------------------------------------------------------------------------------

        let currentPass = '';
        let filesList = [];
        let deviceId = localStorage.getItem('phantom_dev_id') || ('dev_' + Math.random().toString(36).substr(2, 9));
        localStorage.setItem('phantom_dev_id', deviceId);

        async function login() {
            currentPass = document.getElementById('secretPass').value.trim();
            if(!currentPass) return alert('Parolni kiriting!');

            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('loadingOverlay').innerText = 'Tekshirilmoqda...';

            try {
                let res = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/passwords_db.json`, {
                    headers: { 'Authorization': `token ${GH_TOKEN}` }
                });

                let db = {};
                let sha = null;
                if(res.ok) {
                    let fileData = await res.json();
                    sha = fileData.sha;
                    db = JSON.parse(decodeURIComponent(escape(atob(fileData.content))));
                }

                let passKey = btoa(currentPass);

                if(db[passKey]) {
                    if(db[passKey] !== deviceId) {
                        throw new Error('Bu parol boshqa qurilma tomonidan band qilingan!');
                    }
                } else {
                    db[passKey] = deviceId;
                    await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/passwords_db.json`, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${GH_TOKEN}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: 'New pass', content: btoa(unescape(encodeURIComponent(JSON.stringify(db)))), sha: sha })
                    });
                }

                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                await loadFiles();
            } catch(e) {
                alert(e.message);
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        async function loadFiles() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            try {
                let folder = `vault_${btoa(currentPass).substr(0,10)}`;
                let res = await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${folder}`, {
                    headers: { 'Authorization': `token ${GH_TOKEN}` }
                });
                filesList = res.ok ? await Promise.all((await res.json()).map(async f => await (await fetch(f.download_url)).json())) : [];
                render();
            } catch(e) { console.error(e); }
            finally { document.getElementById('loadingOverlay').style.display = 'none'; }
        }

        async function uploadFiles(newFiles) {
            document.getElementById('loadingOverlay').style.display = 'flex';
            let folder = `vault_${btoa(currentPass).substr(0,10)}`;
            for(let f of newFiles) {
                let reader = new FileReader();
                reader.readAsDataURL(f);
                await new Promise(r => reader.onload = r);
                
                let fileObj = { id: 'f_' + Date.now() + Math.random(), name: f.name, size: f.size, data: reader.result };
                await fetch(`https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${folder}/${fileObj.id}.json`, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${GH_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'Upload', content: btoa(unescape(encodeURIComponent(JSON.stringify(fileObj)))) })
                });
            }
            await loadFiles();
        }

        function render() {
            let grid = document.getElementById('filesGrid');
            grid.innerHTML = '';
            filesList.forEach(f => {
                grid.innerHTML += `<div class="file-card" onclick="download('${f.id}')">
                    <div class="file-name">${f.name}</div>
                    <div class="file-size">${(f.size/1024/1024).toFixed(2)} MB</div>
                </div>`;
            });
        }

        function download(id) {
            let f = filesList.find(x => x.id == id);
            let a = document.createElement('a'); a.href = f.data; a.download = f.name; a.click();
        }

        // Three.js Fon
        const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true }); renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('webgl-container').appendChild(renderer.domElement);
        const geom = new THREE.BufferGeometry(); const pos = new Float32Array(1000 * 3);
        for(let i=0; i<3000; i++) pos[i] = (Math.random() - 0.5) * 200;
        geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        const stars = new THREE.Points(geom, new THREE.PointsMaterial({size: 0.7, color: 0x00f2fe}));
        scene.add(stars); camera.position.z = 50;
        (function anim() { requestAnimationFrame(anim); stars.rotation.y += 0.001; renderer.render(scene, camera); })();
    </script>
</body>
</html>
